<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUST — OG Gust Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0f;
    --panel:#12141b;
    --line:#242835;
    --text:#e8e6e1;
    --dim:#7a8090;
    --a:#3d5cf5;
    --b:#f0342a;
    --c:#12b263;
    --d:#f5c518;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  header{
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--line);
  }
  h1{font-size:15px;font-weight:700;letter-spacing:.28em;text-transform:uppercase}
  header .sub{font-size:12px;color:var(--dim);letter-spacing:.06em}
  header .stats{margin-left:auto;display:flex;gap:22px;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
  .stat b{display:block;font-size:17px;font-weight:700;color:var(--text);line-height:1.25}
  .stat span{color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}
  #msg{
    position:absolute;left:50%;top:calc(50% + 130px);transform:translateX(-50%);
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;
    letter-spacing:.05em;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .25s;text-align:center;
  }
  footer{
    padding:11px 20px;border-top:1px solid var(--line);background:var(--panel);
    display:flex;gap:26px;flex-wrap:wrap;align-items:center;
    font-size:12px;color:var(--dim);
  }
  footer .k{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    border:1px solid var(--line);border-radius:4px;padding:1px 7px;
    color:var(--text);margin-right:6px;
  }
  footer .rule{color:var(--dim);max-width:640px;line-height:1.5}
  @media (max-width:640px){
    header .stats{width:100%;margin-left:0;gap:16px}
    footer{font-size:11px;gap:14px}
  }
</style>
</head>
<body>

<header>
  <h1>Gust</h1>
  <span class="sub">OG Gust — Mockup 2D</span>
  <div class="stats">
    <div class="stat"><b id="s-score">0</b><span>Treffer</span></div>
    <div class="stat"><b id="s-sync">–</b><span>Abweichung</span></div>
    <div class="stat"><b id="s-window">400 ms</b><span>Fenster</span></div>
  </div>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="msg"></div>
</div>

<footer>
  <div><span class="k">A</span>Controller A &nbsp; <span class="k">S</span>Controller D &nbsp; <span class="k">K</span>Controller B &nbsp; <span class="k">L</span>Controller C</div>
  <div class="rule">Taste halten = Farbanteil laden. Loslassen = Impuls schicken. Das Signal braucht 1,1 s bis zur Kugel — alle vier müssen im selben Fenster ankommen, mit ähnlichem Anteil.</div>
</footer>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
let W=0, H=0, DPR=1;

function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = r.width; H = r.height;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize', resize);

/* ---------- Modell ---------- */
const TRAVEL = 1100;          // ms Laufzeit Controller -> Kugel
const CHARGE_TIME = 900;      // ms bis voller Farbanteil
const SEG = 44;               // LED-Segmente pro Kabel

const CTRL = [
  {id:'A', key:'a', col:'#3d5cf5', rgb:[61,92,245],  ax:0.15, ay:0.17, bow:-1},
  {id:'B', key:'k', col:'#f0342a', rgb:[240,52,42],  ax:0.85, ay:0.17, bow: 1},
  {id:'C', key:'l', col:'#12b263', rgb:[18,178,99],  ax:0.85, ay:0.83, bow:-1},
  {id:'D', key:'s', col:'#f5c518', rgb:[245,197,24], ax:0.15, ay:0.83, bow: 1},
];
CTRL.forEach(c=>{ c.charge=0; c.holding=false; c.build=0; c.lastSend=-99999; c.flash=0; });

let pulses = [];      // {c, t0, amt, ghost}
let arrivals = [];     // {id, t, amt}
let ball = {energy:0, ring:0, shake:0};
let score = 0, win = 400, lastSpread = null, gameT = 0;
let center = {x:0,y:0}, R = 46;

function layout(){
  center.x = W/2; center.y = H/2;
  R = Math.max(30, Math.min(W,H)*0.075);
  CTRL.forEach(c=>{
    c.x = c.ax*W; c.y = c.ay*H;
    // Kontrollpunkt für die Kabelkurve
    const mx=(c.x+center.x)/2, my=(c.y+center.y)/2;
    const dx=center.x-c.x, dy=center.y-c.y;
    const len=Math.hypot(dx,dy)||1;
    const k=0.17*c.bow;
    c.cx = mx + (-dy/len)*len*k;
    c.cy = my + ( dx/len)*len*k;
  });
}

function pointAt(c, t){
  const u=1-t;
  return {
    x: u*u*c.x + 2*u*t*c.cx + t*t*center.x,
    y: u*u*c.y + 2*u*t*c.cy + t*t*center.y
  };
}

/* ---------- Ton ---------- */
let ac=null;
function beep(freq, dur, gain, type){
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(gain, ac.currentTime+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.05);
  }catch(e){}
}

/* ---------- Eingabe ---------- */
const held = {};
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  const c = CTRL.find(c=>c.key===k);
  if(!c) return;
  e.preventDefault();
  if(held[k]) return;
  held[k]=true; c.holding=true; c.charge=0.12;
});
window.addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  const c = CTRL.find(c=>c.key===k);
  if(!c) return;
  held[k]=false;
  if(c.holding) send(c);
  c.holding=false; c.charge=0;
});
// Touch/Klick auf Controller-Feld
canvas.addEventListener('pointerdown', e=>{
  const r=canvas.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const c = CTRL.find(c=>Math.hypot(c.x-px,c.y-py) < R*1.4);
  if(c && !c.holding){ c.holding=true; c.charge=0.12; c._ptr=e.pointerId; }
});
window.addEventListener('pointerup', ()=>{
  CTRL.forEach(c=>{ if(c.holding){ send(c); c.holding=false; c.charge=0; } });
});

function send(c){
  const amt = Math.max(0.12, c.charge);
  pulses.push({c, t0:gameT, amt, ghost:false});
  c.build = Math.min(1, c.build + 0.22 + amt*0.30);
  c.lastSend = gameT;
  c.flash = 1;
  beep(220 + amt*260, 0.12, 0.05, 'triangle');
}

/* ---------- Ankunft & Wertung ---------- */
function arrive(p){
  arrivals = arrivals.filter(a => gameT - a.t < 1800 && a.id !== p.c.id);
  arrivals.push({id:p.c.id, t:gameT, amt:p.amt});
  ball.energy = Math.min(1, ball.energy + 0.16 + p.amt*0.12);
  ball.ring = 1;
  beep(440, 0.09, 0.035, 'sine');

  if(arrivals.length === 4){
    const ts = arrivals.map(a=>a.t);
    const spread = Math.max(...ts) - Math.min(...ts);
    const amts = arrivals.map(a=>a.amt);
    const ratio = Math.max(...amts) - Math.min(...amts);
    lastSpread = Math.round(spread);

    if(spread <= win && ratio <= 0.34){
      score++;
      win = Math.max(150, win - 30);
      ball.energy = 1; ball.shake = 1;
      successBurst();
      show('Kugel leuchtet — ' + Math.round(spread) + ' ms Abweichung', '#e8e6e1');
      [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.5,0.05,'sine'), i*70));
    } else if(spread > win){
      show('Nicht synchron — ' + Math.round(spread) + ' ms, erlaubt sind ' + win + ' ms', '#f0342a');
      ball.energy *= 0.4;
    } else {
      show('Timing passt, Farbanteile zu ungleich', '#f5c518');
      ball.energy *= 0.55;
    }
    arrivals = [];
  }
}

function successBurst(){
  // Lauflicht: mehrfach abgestufte Geisterimpulse auf allen Kabeln
  for(let w=0; w<3; w++){
    CTRL.forEach(c=>{
      setTimeout(()=>{
        pulses.push({c, t0:gameT, amt:0.9 - w*0.22, ghost:true});
        c.build = 1;
      }, w*170);
    });
  }
}

let msgTimer=null;
function show(text, color){
  msgEl.textContent = text;
  msgEl.style.color = color;
  msgEl.style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>{ msgEl.style.opacity = 0; }, 2200);
}

/* ---------- Update ---------- */
function update(dt){
  CTRL.forEach(c=>{
    if(c.holding) c.charge = Math.min(1, c.charge + dt/CHARGE_TIME);
    // Aufbau zerfällt: erst langsam, dann schneller
    const idle = (gameT - c.lastSend)/1000;
    if(idle > 2.5){
      const rate = 0.04 + Math.min(0.5, (idle-2.5)*0.09);
      c.build = Math.max(0, c.build - rate*dt/1000);
    }
    c.flash = Math.max(0, c.flash - dt/260);
  });

  for(let i=pulses.length-1;i>=0;i--){
    const p = pulses[i];
    if((gameT - p.t0)/TRAVEL >= 1){
      if(!p.ghost) arrive(p);
      else { ball.ring = Math.max(ball.ring, 0.7); }
      pulses.splice(i,1);
    }
  }

  ball.energy = Math.max(0, ball.energy - dt/5200);
  ball.ring   = Math.max(0, ball.ring - dt/700);
  ball.shake  = Math.max(0, ball.shake - dt/900);

  document.getElementById('s-score').textContent = score;
  document.getElementById('s-sync').textContent = lastSpread===null ? '–' : lastSpread+' ms';
  document.getElementById('s-window').textContent = win+' ms';
}

/* ---------- Zeichnen ---------- */
function rgba(c,a){ return 'rgba('+c.rgb[0]+','+c.rgb[1]+','+c.rgb[2]+','+a+')'; }

function drawCable(c){
  for(let i=0;i<SEG;i++){
    const t = i/(SEG-1);
    const p = pointAt(c, t);
    let lit = 0.06;
    if(t <= c.build){
      const edge = Math.min(1, (c.build - t)*14);
      lit = 0.10 + 0.55*edge;
    }
    // Impulse
    let glow = 0;
    for(const pu of pulses){
      if(pu.c !== c) continue;
      const pt = (gameT - pu.t0)/TRAVEL;
      const d = pt - t;
      if(d > -0.012 && d < 0.16){
        glow = Math.max(glow, (1 - d/0.16) * (0.55 + pu.amt*0.65));
      }
    }
    const a = Math.min(1, lit + glow);
    const rad = 2.1 + glow*3.4;
    if(glow > 0.05){
      ctx.beginPath();
      ctx.fillStyle = rgba(c, glow*0.16);
      ctx.arc(p.x, p.y, rad*4.2, 0, 6.2832); ctx.fill();
    }
    ctx.beginPath();
    ctx.fillStyle = rgba(c, a);
    ctx.arc(p.x, p.y, rad, 0, 6.2832); ctx.fill();
  }
}

function drawController(c){
  const s = R*0.92;
  const glow = Math.max(c.flash, c.charge*0.8);
  ctx.save();
  ctx.translate(c.x, c.y);

  if(glow>0.02){
    ctx.beginPath();
    ctx.fillStyle = rgba(c, glow*0.13);
    ctx.arc(0,0,s*2.4,0,6.2832); ctx.fill();
  }

  ctx.lineWidth = 2.5;
  ctx.strokeStyle = rgba(c, 0.55 + glow*0.45);
  ctx.strokeRect(-s, -s*0.8, s*2, s*1.6);

  // Ladering
  ctx.beginPath();
  ctx.lineWidth = 3;
  ctx.strokeStyle = rgba(c, 0.20);
  ctx.arc(0,0,s*0.5,0,6.2832); ctx.stroke();
  if(c.charge>0){
    ctx.beginPath();
    ctx.strokeStyle = rgba(c, 0.95);
    ctx.arc(0,0,s*0.5,-Math.PI/2, -Math.PI/2 + 6.2832*c.charge); ctx.stroke();
  }

  ctx.fillStyle = rgba(c, 0.9);
  ctx.font = '700 12px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(c.key.toUpperCase(), 0, 0);

  ctx.fillStyle = rgba(c, 0.75);
  ctx.font = '500 12px "Space Grotesk", sans-serif';
  ctx.fillText('CONTROLLER ' + c.id, 0, -s*0.8 - 16);
  ctx.restore();
}

function drawBall(){
  const e = ball.energy;
  const jitter = ball.shake * 2.5;
  const x = center.x + (Math.random()-0.5)*jitter;
  const y = center.y + (Math.random()-0.5)*jitter;
  const pulse = 1 + Math.sin(gameT/260)*0.05*(0.3+e);

  const g = ctx.createRadialGradient(x,y,R*0.2, x,y,R*(3.6+e*2));
  g.addColorStop(0,'rgba(255,248,220,'+(0.10+e*0.42)+')');
  g.addColorStop(1,'rgba(255,248,220,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,R*(3.6+e*2),0,6.2832); ctx.fill();

  if(ball.ring>0){
    ctx.beginPath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,248,220,'+(ball.ring*0.5)+')';
    ctx.arc(x,y,R*(1.1 + (1-ball.ring)*2.4),0,6.2832); ctx.stroke();
  }

  ctx.beginPath();
  ctx.fillStyle = 'rgba(255,250,235,'+(0.05+e*0.85)+')';
  ctx.arc(x,y,R*pulse,0,6.2832); ctx.fill();

  ctx.beginPath();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(232,230,225,'+(0.30+e*0.6)+')';
  ctx.arc(x,y,R*pulse,0,6.2832); ctx.stroke();

  ctx.fillStyle = e>0.5 ? 'rgba(10,11,15,.85)' : 'rgba(232,230,225,.6)';
  ctx.font = '700 12px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('BALL', x, y);
}

function drawMeters(){
  // Farbverhältnis der zuletzt angekommenen Signale
  const bw = 46, bh = 4, gap = 10;
  const total = CTRL.length*bw + (CTRL.length-1)*gap;
  let x = center.x - total/2;
  const y = center.y + R*3.2;
  CTRL.forEach(c=>{
    const a = arrivals.find(a=>a.id===c.id);
    ctx.fillStyle = rgba(c,0.18);
    ctx.fillRect(x, y, bw, bh);
    if(a){ ctx.fillStyle = rgba(c,0.95); ctx.fillRect(x, y, bw*a.amt, bh); }
    x += bw + gap;
  });
}

let last = performance.now();
function frame(now){
  const dt = Math.min(64, now-last); last = now; gameT += dt;
  update(dt);
  ctx.clearRect(0,0,W,H);
  CTRL.forEach(drawCable);
  drawBall();
  CTRL.forEach(drawController);
  drawMeters();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
